<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Catálogo de personagens e recompensas do universo de One Piece.">
    <title>{% block title %}Grand Line Wanted{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Rye&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ url_for('index') }}">
        <span class="brand-mark">☠</span>
        <span>Grand Line Wanted</span>
      </a>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer>Projeto de fã, sem fins comerciais. Personagens pertencem aos seus respectivos criadores.</footer>
  </body>
</html>
